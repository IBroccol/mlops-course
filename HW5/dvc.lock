            указано для объекта? Не представляй число как текущее."
          - "Карточка источника Wikidata (Q11194):\nобъект — Сараево; тип — город;
            страна — Босния и Герцеговина; административный регион — Сараевский кантон;
            население — 275 524; широта — 43.85639; долгота — 18.41306.\n\nЗадание:
            Запиши координаты объекта с обозначением полушарий."
          - "Карточка источника Wikidata (Q1019424):\nобъект — Рюфиск; тип — город;
