# Единственная точка конфигурации. Датасет Wikidata ДЗ3–4.
# batch 4 × accumulation 8 = 32, одна полная эпоха / 90 шагов.
model:
  name: Qwen/Qwen3-0.6B
  device: auto
  dtype: bfloat16
  enable_thinking: false
data:
  train: ../HW4/data/tokenized/train.pt
  val: ../HW4/data/tokenized/val.pt
lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
train:
  seed: 42
  epochs: 1
  batch_size: 4
  grad_accum: 8
  lr: 0.0002
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  eval_every: 10
  eval_batch_size: 8
  gradient_checkpointing: true
  max_steps: null
  checkpoint_every: 10
variants:
- name: all_layers
  freeze_first: 0
- name: freeze14
  freeze_first: 14
compare:
  max_new_tokens: 160
  prompts:
  - 'Карточка источника Wikidata (Q203299):

    объект — Эль-Файюм; тип — город; страна — Египет; административный регион — Эль-Файюм; население —
    519 047; широта — 29.3; долгота — 30.83333.


    Задание: В какой стране и каком административном регионе находится объект?'
  - 'Карточка источника Wikidata (Q243322):

    объект — Гуджранвала; тип — город; страна — Пакистан; административный регион — Гуджранвала; население
    — 2 027 001; широта — 32.15; долгота — 74.18333.


    Задание: Какое население указано для объекта? Не представляй число как текущее.'
  - 'Карточка источника Wikidata (Q11194):

    объект — Сараево; тип — город; страна — Босния и Герцеговина; административный регион — Сараевский
    кантон; население — 275 524; широта — 43.85639; долгота — 18.41306.


    Задание: Запиши координаты объекта с обозначением полушарий.'
  - 'Карточка источника Wikidata (Q1019424):

    объект — Рюфиск; тип — город; страна — Сенегал; административный регион — не указан; население — 295
    459; широта — 14.71403; долгота — -17.27231.


    Задание: Составь краткую географическую справку только по данным карточки.'
  - 'Карточка источника Wikidata (Q1014):

    объект — Либерия; тип — страна; столица — Монровия; континент — Африка; население — 5 214 030; площадь
    — 111 369.00 км².


    Задание: На каком континенте находится страна и как называется её столица?'
  system: Ты отвечаешь на вопросы о географии по предоставленной карточке Wikidata. Не добавляй фактов,
    которых нет в карточке, и указывай ограничения снимка данных.
paths:
  models: models
  metrics: metrics
  curves: docs/curves.png
  compare: docs/compare.md
