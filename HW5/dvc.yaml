# split (HW3) → tokenize (HW4) → train_all / train_freeze → compare / plot
# Численные метрики и JSON с ответами хранятся в DVC, не в Git.
stages:
  train_all:
    cmd: uv run python -m src.train --variant all_layers
    deps:
    - ../HW4/data/tokenized/train.pt
    - ../HW4/data/tokenized/val.pt
    - src/train.py
    - src/data.py
    - src/runtime.py
    - src/config.py
    - uv.lock
    params:
    - model
    - lora
    - train
    - variants
    - data
    - paths.models
    - paths.metrics
    outs:
    - models/adapter_all_layers
    metrics:
    - metrics/train_all_layers.json:
        cache: true
  train_freeze:
    cmd: uv run python -m src.train --variant freeze14
    deps:
    - ../HW4/data/tokenized/train.pt
    - ../HW4/data/tokenized/val.pt
    - src/train.py
    - src/data.py
    - src/runtime.py
    - src/config.py
    - uv.lock
    params:
    - model
    - lora
    - train
    - variants
    - data
    - paths.models
    - paths.metrics
    outs:
    - models/adapter_freeze14
    metrics:
    - metrics/train_freeze14.json:
        cache: true
  compare:
    cmd: uv run python -m src.compare --variant all_layers
    deps:
    - models/adapter_all_layers
    - src/compare.py
    - src/runtime.py
    - src/config.py
    - uv.lock
    params:
    - compare
    - model
    - train.seed
    - paths
    outs:
    - docs/compare.md:
        cache: false
    - metrics/compare_all_layers.json:
        cache: true
  plot:
    cmd: uv run python -m src.plot
    deps:
    - src/plot.py
    - src/config.py
    - metrics/train_all_layers.json
    - metrics/train_freeze14.json
    params:
    - paths.metrics
    - paths.curves
    outs:
    - docs/curves.png:
        cache: false
