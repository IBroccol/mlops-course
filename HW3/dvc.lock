    params:
      params.yaml:
        collect:
          version: v2
          sources:
            v1:
            - sources/data/world_v1.jsonl
            v2:
            - sources/data/world_v1.jsonl
            - sources/data/world_v2.jsonl
          snapshot_metadata: sources/data/snapshot.json
          tasks:
          - location
          - population
          - coordinates
          - summary
          system_prompts:
          - Ты отвечаешь на вопросы о географии по предоставленной карточке 
            Wikidata. Не добавляй фактов, которых нет в карточке, и указывай 
            ограничения снимка данных.
          - Используй только структурированные факты из карточки источника. 
            Отвечай по-русски, кратко и не выдавай значение из снимка за 
            актуальное на сегодняшний день.
          - Ты справочный географический ассистент. Извлекай факты из входной 
            карточки, сохраняй числа и идентификатор Wikidata без домыслов.
          - Составляй проверяемые географические ответы по данным Wikidata. Если
            поле отсутствует, скажи об этом вместо предположения.
          - Ответь на географический вопрос строго по приложенной карточке. 
            Различай дату снимка источника и дату, на которую могло быть 
            измерено значение.
